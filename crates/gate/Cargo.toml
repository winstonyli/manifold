[package]
name = "gate"
version.workspace = true
edition.workspace = true
description = "The headless gate flows (link probe, smoke test, two-instance test, engine and jar probes) as one Rust program: launches manifold --headless, drives it over stdin, checks the exported state."

[lints]
workspace = true

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
sha1.workspace = true
sha2.workspace = true
# The border checks read the screenshot PNG; PNG decoding only (the workspace default).
image.workspace = true

# Windows-only: the Job Object that kills every launched instance if `gate` itself dies. Same crate, version and
# feature set as crates/manifold's engine-host job (process_manager/job.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
] }
