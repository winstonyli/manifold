[package]
name = "gate"
version.workspace = true
edition.workspace = true
description = "The headless gate flows (link probe, smoke test, two-instance test, engine and jar probes) as one Rust program: launches manifold --headless, drives it over stdin, checks the exported state."

[lints]
workspace = true

[dependencies]
manifold-hosts.workspace = true
# The kill-on-close job every instance joins (`instance::job`).
manifold-view-protocol.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha1.workspace = true
sha2.workspace = true
# The border checks read the screenshot PNG; PNG decoding only (the workspace default).
image.workspace = true

# Windows-only: DPAPI for the jar probe (`jar.rs`; `Win32_Security_Cryptography` enables `Win32_Security` itself),
# and the CPU-time sample and local time (`all.rs`). The instance job is `manifold_view_protocol::job`.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
] }

[dev-dependencies]
tempfile.workspace = true
