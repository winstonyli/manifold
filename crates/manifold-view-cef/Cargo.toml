[package]
name = "manifold-view-cef"
version.workspace = true
edition.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
cef = { workspace = true, features = ["build-util", "resources"] }
manifold-pages.workspace = true
manifold-view-protocol.workspace = true

# The exe keeps the name released builds, release.yml and the scripts know; it changes with a release that
# publishes assets under the new names (spec 2026-10-12, Step 0).
[[bin]]
name = "manifold-view-cef"
path = "src/main.rs"
