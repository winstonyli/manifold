[package]
name = "manifold-view-cef"
version.workspace = true
edition.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
serde_json.workspace = true
cef = { workspace = true, features = ["build-util", "resources"] }
manifold-view-protocol.workspace = true

[target.'cfg(windows)'.dependencies]
# Only for the browser-process Job Object setup in main.rs (kills orphaned
# CEF renderer/GPU subprocesses on exit) -- same crate/features
# engine-host-webview2 already uses for the identical purpose.
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

# The exe keeps the name released builds, host_pin.rs and the scripts know; it changes with a release that
# publishes assets under the new names (spec 2026-10-12, Step 0).
[[bin]]
name = "manifold-engine-cef"
path = "src/main.rs"
