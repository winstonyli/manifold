[package]
name = "manifold-view-webview2"
version.workspace = true
edition.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
manifold-view-protocol.workspace = true
# Real JSON-string unescaping for `ExecuteScript`'s own JSON-encoded return
# values -- see `nav_state.rs`'s JSON-body detection for why the plain
# strip-outer-quotes trick `input.rs`'s href parsing gets away with isn't
# safe there (a page body can contain literal `"`/`\n`/etc, a link href
# effectively never does).
serde_json.workspace = true
webview2-com.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    # Real dependencies now (`composition.rs` visual-tree hosting) -- used by
    # the engine-host to set up composition-based rendering instead of plain
    # windowed hosting.
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_System_WinRT_Composition",
    "System",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows-numerics.workspace = true

[dev-dependencies]
# Only used by the Phase-2 capture spike (examples/capture_spike.rs) to
# dump a captured frame to a PNG for visual verification -- not needed by
# the real engine-host binary, which writes raw bytes into SharedFrameBuffer
# instead.
image.workspace = true

# The exe keeps the name released builds, host_pin.rs and the scripts know; it changes with a release that
# publishes assets under the new names (spec 2026-10-12, Step 0).
[[bin]]
name = "manifold-engine-webview2"
path = "src/main.rs"
