<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New Tab</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    background: #1E1F24;
    color: #E6E7EB;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 18vh 2em 3em;
    max-width: 560px;
    margin: 0 auto;
    text-align: center;
  }
  h1 {
    color: #58A6FF;
    font-size: 2.2em;
    margin-bottom: 0.2em;
  }
  p {
    color: #9497A1;
    font-size: 1.1em;
    line-height: 1.6;
    margin: 0.3em 0;
  }
  kbd {
    color: #58A6FF;
    font-family: ui-monospace, "Cascadia Code", monospace;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 4px;
    padding: 0.05em 0.4em;
  }
</style>
</head>
<body>
  <h1>Manifold</h1>
  <p>Search or type an address in the bar above (<kbd>Ctrl</kbd> <kbd>L</kbd>).</p>
  <p><kbd>Ctrl</kbd> <kbd>G</kbd> shows all your tabs as a graph.</p>
</body>
</html>
