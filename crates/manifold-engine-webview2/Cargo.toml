[package]
name = "manifold-engine-webview2"
version.workspace = true
edition.workspace = true
description.workspace = true

[dependencies]
ipc-protocol = { version = "0.3.0", path = "../ipc-protocol" }
# Real JSON-string unescaping for `ExecuteScript`'s own JSON-encoded return
# values -- see `nav_state.rs`'s JSON-body detection for why the plain
# strip-outer-quotes trick `input.rs`'s href parsing gets away with isn't
# safe there (a page body can contain literal `"`/`\n`/etc, a link href
# effectively never does).
serde_json = "1"
# Pinned to match webview2-com's own workspace pin (wravery/webview2-rs
# Cargo.toml) exactly -- COM/WinRT interface types from a mismatched
# `windows` version are not interchangeable with webview2-com's, so this
# must track whatever version webview2-com itself was built against, not
# float independently.
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    # Real dependencies now (`composition.rs` visual-tree hosting) -- used by
    # the engine-host to set up composition-based rendering instead of plain
    # windowed hosting.
    "UI_Composition",
    "UI_Composition_Desktop",
    "Win32_System_WinRT_Composition",
    "System",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# Real dependency now (`composition.rs`'s `Vector2` for visual sizing), not
# example-only -- pinned to match the version `windows` 0.62.2 itself
# depends on (see that crate's own `[dependencies.windows-numerics]`), same
# reasoning as the `webview2-com` pin above.
windows-numerics = { version = "0.3.1", default-features = false, features = ["std"] }

[dev-dependencies]
# Only used by the Phase-2 capture spike (examples/capture_spike.rs) to
# dump a captured frame to a PNG for visual verification -- not needed by
# the real engine-host binary, which writes raw bytes into SharedFrameBuffer
# instead.
image = { version = "0.25", default-features = false, features = ["png"] }
