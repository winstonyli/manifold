<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Manifold Tips</title>
<style>
  :root {
    color-scheme: dark;
  }
  body {
    background: #1E1F24;
    color: #E6E7EB;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 3em 2em;
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    color: #58A6FF;
    font-size: 1.6em;
    margin-bottom: 0.1em;
  }
  .tagline {
    color: #9497A1;
    font-size: 1.05em;
    margin-top: 0;
    margin-bottom: 2em;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  td {
    padding: 0.6em 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  td.key {
    color: #58A6FF;
    font-family: ui-monospace, "Cascadia Code", monospace;
    white-space: nowrap;
    padding-right: 1.5em;
  }
  td.desc {
    color: #9497A1;
  }
</style>
</head>
<body>
  <h1>Quick tips</h1>
  <p class="tagline">A few shortcuts worth knowing early on.</p>

  <table>
    <tr><td class="key">Ctrl+T</td><td class="desc">New tab</td></tr>
    <tr><td class="key">Ctrl+Shift+G</td><td class="desc">New group</td></tr>
    <tr><td class="key">Ctrl+G</td><td class="desc">Toggle Tab / Graph view</td></tr>
    <tr><td class="key">Ctrl+K</td><td class="desc">Quick switcher — jump to any open tab</td></tr>
    <tr><td class="key">Ctrl+Shift+T</td><td class="desc">Reopen the last closed tab</td></tr>
    <tr><td class="key">F1</td><td class="desc">Full keyboard shortcut reference</td></tr>
  </table>
</body>
</html>
