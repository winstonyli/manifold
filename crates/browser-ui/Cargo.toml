[package]
name = "browser-ui"
version.workspace = true
edition.workspace = true

[dependencies]
egui = "0.36.2"
egui-wgpu = "0.36.2"
egui-winit = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png"] }
ipc-protocol = { version = "0.1.0", path = "../ipc-protocol" }
pollster = "1.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
wgpu = "30.0.1"
winit = "0.30.13"
