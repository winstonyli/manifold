[package]
name = "engine-host-webview2"
version.workspace = true
edition.workspace = true

[dependencies]
ipc-protocol = { version = "0.1.0", path = "../ipc-protocol" }
# Pinned to match webview2-com's own workspace pin (wravery/webview2-rs
# Cargo.toml) exactly -- COM/WinRT interface types from a mismatched
# `windows` version are not interchangeable with webview2-com's, so this
# must track whatever version webview2-com itself was built against, not
# float independently.
webview2-com = "0.39.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
