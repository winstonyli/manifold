[package]
name = "manifold"
version.workspace = true
edition.workspace = true
description.workspace = true

[lints]
workspace = true

[dependencies]
egui.workspace = true
egui-phosphor = { workspace = true, features = ["light"] }
egui-wgpu.workspace = true
egui-winit = { workspace = true, features = ["accesskit"] }
egui_commonmark = { workspace = true, features = ["pulldown_cmark"] }
etcetera.workspace = true
image = { workspace = true, features = ["jpeg", "ico", "webp", "bmp", "gif"] }
ipc-protocol.workspace = true
pdfium-render.workspace = true
pdfium-auto.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
foldhash.workspace = true
getrandom.workspace = true
bzip2.workspace = true
rfd.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
sha1.workspace = true
sha2.workspace = true
tar.workspace = true
icu_properties.workspace = true
unicode-segmentation.workspace = true
ureq.workspace = true
wgpu.workspace = true
winit.workspace = true

[dev-dependencies]
skrifa.workspace = true

# Windows-only dependencies. `manifold` also compiles on Linux (`cargo check
# -p manifold` under WSL), and `windows` pulls `windows-future`, which does not
# build off Windows, so neither crate may be a plain dependency.
[target.'cfg(windows)'.dependencies]
# Only for `SetProcessDpiAwarenessContext` at startup -- see `main()`'s own
# doc comment on it.
windows = { workspace = true, features = ["Win32_UI_HiDpi", "Win32_Security_Cryptography"] }
# Forces the native titlebar dark regardless of the OS theme setting (see
# `apply_dark_titlebar`'s own doc comment in theme.rs), plus the uses below.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    # For `App::cursor_point` (drag and drop): the drop point isn't
    # reported by winit's own `DroppedFile` (see that arm's own comment in
    # event_loop.rs), so it's read straight from the OS instead.
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    # For the engine-host Job Object (see `process_manager::engine_job`'s own
    # doc comment) -- `Win32_Security`/`Win32_System_Threading` aren't used
    # directly, but `JOBOBJECT_EXTENDED_LIMIT_INFORMATION` embeds types from
    # both (a `SECURITY_ATTRIBUTES` pointer parameter, an `IO_COUNTERS`
    # field), and windows-sys gates each Win32 namespace behind its own
    # feature with no automatic cross-feature pulling.
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_Threading",
] }
