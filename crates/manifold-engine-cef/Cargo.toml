[package]
name = "manifold-engine-cef"
version.workspace = true
edition.workspace = true
description.workspace = true

[dependencies]
serde_json = "1"
cef = { version = "152.1.0", default-features = false, features = ["build-util", "resources"] }
ipc-protocol = { version = "0.2.0", path = "../ipc-protocol" }

[target.'cfg(windows)'.dependencies]
# Only for the browser-process Job Object setup in main.rs (kills orphaned
# CEF renderer/GPU subprocesses on exit) -- same crate/features
# engine-host-webview2 already uses for the identical purpose.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
