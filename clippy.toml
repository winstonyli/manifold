disallowed-methods = [
    # WAITIDLE waits for easing only through `theme::animate`, which records a pass that draws a value mid-way;
    # a value eased straight through egui goes unseen, and a headless shot can catch it half done.
    { path = "egui::Context::animate_bool", reason = "use theme::animate: WAITIDLE only sees easing that goes through it" },
    { path = "egui::Context::animate_bool_responsive", reason = "use theme::animate: WAITIDLE only sees easing that goes through it" },
    { path = "egui::Context::animate_bool_with_easing", reason = "use theme::animate: WAITIDLE only sees easing that goes through it" },
    { path = "egui::Context::animate_bool_with_time", reason = "use theme::animate: WAITIDLE only sees easing that goes through it" },
    { path = "egui::Context::animate_bool_with_time_and_easing", reason = "use theme::animate: WAITIDLE only sees easing that goes through it" },
    { path = "egui::Context::animate_value_with_time", reason = "use theme::animate: WAITIDLE only sees easing that goes through it" },
]
