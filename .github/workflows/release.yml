name: release
# A pushed vX.Y.Z tag builds the downloadable hosts and manifold.exe (which pins them by hash) and leaves a draft release
# to read and publish. Run by hand (workflow_dispatch) on any branch it does the same build and checks but makes no
# release and no tag: dist/ is uploaded as a workflow artifact instead, so a workflow change can be tried without
# burning a version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # WebKit's host is a Linux ELF that WSL runs from the Windows drive. It is built on the oldest Ubuntu we support
  # (22.04, the first with libwebkit2gtk-4.1), since a newer runner's glibc would not start on an older distro. The
  # release job pins it under linux-x64.
  webkit-host:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: cargo build --release --locked -p manifold-view-webkitgtk
      - uses: actions/upload-artifact@v4
        with:
          name: webkit-host
          path: target/release/manifold-view-webkitgtk
          retention-days: 3
  release:
    needs: webkit-host
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dry run, so name the workspace version
        if: github.ref_type != 'tag'
        run: |
          $v = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1 | ForEach-Object { $_.Matches[0].Groups[1].Value }
          "TAG=v$v" | Add-Content $env:GITHUB_ENV
      - name: Keep the tag object (checkout may flatten an annotated tag)
        if: github.ref_type == 'tag'
        run: git fetch --force origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
      - run: rustup toolchain install
      - uses: actions/download-artifact@v4
        with:
          name: webkit-host
          path: webkit-host
      - run: cargo build --locked -p gate
      - name: The tag is one we can build
        if: github.ref_type == 'tag'
        run: |
          & target/debug/gate.exe release-check $env:TAG
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Servo host (dynamic CRT, so no static-crt flag; its ANGLE DLLs ship beside it)
        run: |
          Get-PSDrive C | Format-Table Used, Free
          cargo build --release --locked -p manifold-view-servo
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Downloadable hosts and their pin manifest
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p manifold-view-cef
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & target/debug/gate.exe release-pins $env:TAG dist webkit-host | Add-Content $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Embedded hosts
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p manifold-view-webview2 -p manifold-view-pdfium
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & target/debug/gate.exe release-embedded $env:TAG dist | Add-Content $env:GITHUB_ENV
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: manifold.exe
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p manifold
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $stem = "manifold-$env:TAG-windows-x64"
          Copy-Item target/release/manifold.exe "dist/$stem.exe"
          $h = (Get-FileHash "dist/$stem.exe" -Algorithm SHA256).Hash.ToLower()
          "$h  $stem.exe" | Set-Content -Encoding ascii "dist/$stem.exe.sha256"
      - name: Package check and release-verify
        run: |
          $stem = "manifold-$env:TAG-windows-x64"
          & target/debug/gate.exe package "dist/$stem.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & target/debug/gate.exe release-verify $env:TAG dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Dry run keeps dist/ as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
      - name: Draft release
        if: github.ref_type == 'tag'
        run: |
          $stem = "manifold-$env:TAG-windows-x64"
          & target/debug/gate.exe release-notes $env:TAG "dist/$stem.host-pins.json" | Set-Content -Encoding utf8 notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release create $env:TAG --draft --verify-tag --title $env:TAG --notes-file notes.md "dist/$stem.exe" "dist/$stem.exe.sha256" (Get-ChildItem dist -File -Filter "$stem.embedded-*.sha256" | ForEach-Object FullName) "dist/$stem.host-pins.json" (Get-ChildItem dist -File | Where-Object Name -Match '-(windows|linux)-x64$' | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { exit 1 }
