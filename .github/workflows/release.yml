name: release
# A pushed vX.Y.Z tag builds the downloadable hosts and manifold.exe (which pins them by hash) and leaves a draft release
# to read and publish. Run by hand (workflow_dispatch) on any branch it does the same build and checks but makes no
# release and no tag: dist/ is uploaded as a workflow artifact instead, so a workflow change can be tried without
# burning a version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dry run, so name the workspace version
        if: github.ref_type != 'tag'
        run: |
          $v = Select-String -Path Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1 | ForEach-Object { $_.Matches[0].Groups[1].Value }
          "TAG=v$v" | Add-Content $env:GITHUB_ENV
      - name: Keep the tag object (checkout may flatten an annotated tag)
        if: github.ref_type == 'tag'
        run: git fetch --force origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
      - run: rustup toolchain install
      - run: cargo build --locked -p gate
      - name: The tag is one we can build
        if: github.ref_type == 'tag'
        run: |
          & target/debug/gate.exe release-check $env:TAG
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Servo host (dynamic CRT, so no static-crt flag; its ANGLE DLLs ship beside it)
        run: |
          Get-PSDrive C | Format-Table Used, Free
          cargo build --release --locked -p manifold-view-servo
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Downloadable hosts and their pin manifest
        run: |
          # Each host is attached to this release; manifold.exe is built with the manifest of their sizes and hashes.
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p manifold-view-cef
          if ($LASTEXITCODE -ne 0) { exit 1 }
          New-Item -ItemType Directory -Force dist | Out-Null
          # ANGLE's DLLs come from mozangle's build output; the newest copy is the one this build made.
          $angle = @{}
          foreach ($dll in 'libEGL.dll', 'libGLESv2.dll') {
            $angle[$dll] = Get-ChildItem target/release/build -Recurse -Filter $dll | Where-Object FullName -Match 'mozangle' | Sort-Object LastWriteTime -Descending | Select-Object -First 1 -ExpandProperty FullName
            if (-not $angle[$dll]) { throw "no $dll under target/release/build" }
          }
          function Source($name) { if ($angle.ContainsKey($name)) { $angle[$name] } else { "target/release/$name" } }
          $hosts = [ordered]@{
            cef = [ordered]@{ 'windows-x64' = @('manifold-engine-cef.exe') }
            servo = [ordered]@{ 'windows-x64' = @('manifold-engine-servo.exe', 'libEGL.dll', 'libGLESv2.dll') }
          }
          $manifest = [ordered]@{}
          foreach ($kind in $hosts.Keys) {
            $manifest[$kind] = [ordered]@{}
            foreach ($platform in $hosts[$kind].Keys) {
              $files = foreach ($name in $hosts[$kind][$platform]) {
                Copy-Item (Source $name) "dist/$name-$platform"
                [ordered]@{ file = $name; size = (Get-Item "dist/$name-$platform").Length; sha256 = (Get-FileHash "dist/$name-$platform" -Algorithm SHA256).Hash.ToLower() }
              }
              $manifest[$kind][$platform] = @($files)
            }
          }
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Encoding ascii "dist/manifold-$env:TAG-windows-x64.host-pins.json"
          Get-Content "dist/manifold-$env:TAG-windows-x64.host-pins.json"
      - name: Embedded hosts and manifold.exe
        run: |
          $env:RUSTFLAGS = '-C target-feature=+crt-static'
          cargo build --release --locked -p manifold-view-webview2 -p manifold-view-pdfium
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:MANIFOLD_HOST_PINS = (Resolve-Path "dist/manifold-$env:TAG-windows-x64.host-pins.json").Path
          New-Item -ItemType Directory -Force dist/embedded | Out-Null
          Copy-Item target/release/manifold-engine-webview2.exe dist/embedded/
          Copy-Item target/release/manifold-view-pdfium.exe dist/embedded/
          $env:MANIFOLD_WEBVIEW2_HOST = (Resolve-Path dist/embedded/manifold-engine-webview2.exe).Path
          $env:MANIFOLD_PDFIUM_HOST = (Resolve-Path dist/embedded/manifold-view-pdfium.exe).Path
          cargo build --release --locked -p manifold
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $stem = "manifold-$env:TAG-windows-x64"
          Copy-Item target/release/manifold.exe "dist/$stem.exe"
          function Record($path, $out) {
            $h = (Get-FileHash $path -Algorithm SHA256).Hash.ToLower()
            "$h  $(Split-Path $path -Leaf)" | Set-Content -Encoding ascii $out
          }
          Record "dist/$stem.exe" "dist/$stem.exe.sha256"
          Record "dist/embedded/manifold-engine-webview2.exe" "dist/$stem.embedded-host.sha256"
          Record "dist/embedded/manifold-view-pdfium.exe" "dist/$stem.embedded-pdf-view.sha256"
      - name: Package check and release-verify
        run: |
          $stem = "manifold-$env:TAG-windows-x64"
          & target/debug/gate.exe package "dist/$stem.exe"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & target/debug/gate.exe release-verify $env:TAG dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Dry run keeps dist/ as a workflow artifact
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3
      - name: Draft release
        if: github.ref_type == 'tag'
        run: |
          $stem = "manifold-$env:TAG-windows-x64"
          & target/debug/gate.exe release-notes $env:TAG "dist/$stem.host-pins.json" | Set-Content -Encoding utf8 notes.md
          if ($LASTEXITCODE -ne 0) { exit 1 }
          gh release create $env:TAG --draft --verify-tag --title $env:TAG --notes-file notes.md "dist/$stem.exe" "dist/$stem.exe.sha256" "dist/$stem.embedded-host.sha256" "dist/$stem.embedded-pdf-view.sha256" "dist/$stem.host-pins.json" (Get-ChildItem dist -File | Where-Object Name -Like "*-windows-x64" | ForEach-Object FullName)
          if ($LASTEXITCODE -ne 0) { exit 1 }
